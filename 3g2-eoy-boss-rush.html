<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3G2 EOY Boss Rush — Revision Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#231942; --ink2:#3b2d6b; --field:#EEF1FF; --paper:#ffffff;
  --amber:#FFB627; --pink:#FF2D85; --teal:#00C2A8; --coral:#FF5A45; --green:#1FB65A; --blue:#3A6BFF;
  --head-h:60px; --tb-h:60px; --foot-h:70px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Nunito',system-ui,sans-serif;font-size:19px;color:var(--ink);background:var(--field);
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.bungee{font-family:'Bungee','Nunito',system-ui,sans-serif;font-weight:400;letter-spacing:.3px}
button,.flip{font-family:inherit;font-size:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* ---------- shell ---------- */
header{flex:none;height:var(--head-h);background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;padding-top:env(safe-area-inset-top,0px)}
header .ttl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:900;font-size:16px}
header .ttl small{display:block;font-weight:700;opacity:.7;font-size:12px}
.chip{background:var(--amber);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:900;font-size:15px;white-space:nowrap}
.hbtn{background:#ffffff1f;color:#fff;border:0;border-radius:10px;padding:11px 14px;min-height:44px;font-weight:800;font-size:15px}
#main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  background-image:radial-gradient(#c9cdf2 1.2px,transparent 1.2px);background-size:22px 22px}
#main.laser-on{touch-action:none}
.wrap{max-width:960px;margin:0 auto;padding:18px 16px 60px}
#toolbar{flex:none;height:var(--tb-h);background:#fff;border-top:2px solid #d9dcf5;display:flex;align-items:center;gap:6px;padding:0 8px;overflow-x:auto;overflow-y:hidden}
#toolbar .tlab{font-size:12px;font-weight:900;color:#6a6f99;white-space:nowrap;margin-right:2px}
#toolbar button{flex:none;min-width:48px;height:46px;border:2px solid #d9dcf5;background:var(--field);border-radius:9px;font-weight:800;font-size:17px;color:var(--ink)}
#toolbar button:active{background:var(--amber)}
footer{flex:none;height:var(--foot-h);background:var(--ink);display:flex;align-items:center;gap:10px;padding:0 12px;padding-bottom:env(safe-area-inset-bottom,0px)}
footer .nav{border:0;border-radius:12px;padding:13px 20px;min-height:48px;font-weight:900;font-size:16px}
#backBtn{background:#ffffff26;color:#fff}
#nextBtn{background:var(--amber);color:var(--ink)}
.nav:disabled{opacity:.35}
#dots{flex:1;display:flex;gap:0;justify-content:center;overflow-x:auto;overflow-y:hidden;min-width:0}
.dot{width:32px;height:44px;border:0;padding:16px 8px;background:transparent;position:relative;flex:none}
.dot::after{content:"";position:absolute;left:10px;top:16px;width:12px;height:12px;border-radius:4px;background:#ffffff33}
.dot.boss::after{border-radius:50%}
.dot.seen::after{background:var(--teal)}
.dot.cur::after{background:var(--amber);transform:scale(1.4)}
/* ---------- common blocks ---------- */
.card{background:var(--paper);border-radius:18px;padding:18px;margin:16px 0;border:2px solid #dcdff7}
.sec-title{font-family:'Bungee';font-size:22px;margin:22px 0 6px}
.lead{font-size:19px;line-height:1.5}
.kw{background:var(--amber);color:var(--ink);border-radius:8px;font-weight:900;padding:1px 8px;line-height:1.9;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-weight:900;font-size:14px}
.badge-think{background:#7B2FF7;color:#fff}
.wk{margin:8px 0}
.wk>div{padding:3px 0;line-height:1.7}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.15}
.fr>span{display:block;padding:0 3px}
.fr>span:last-child{border-top:2px solid currentColor}
sup{font-size:.72em}
/* flip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:12px 0}
.flip{min-width:0;display:grid;perspective:1200px;border:0;background:none;padding:0;text-align:left;color:inherit}
.flip .face{grid-area:1/1;min-width:0;overflow-wrap:break-word;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:18px;transition:transform .55s cubic-bezier(.4,0,.2,1);min-height:150px}
.flip .front{background:var(--amber);display:flex;flex-direction:column;justify-content:center;font-weight:900;font-size:19px;animation:pulse 1.8s ease-in-out infinite}
.flip .front .tap{font-size:13px;font-weight:800;opacity:.75;margin-top:10px}
.flip .back{-webkit-transform:rotateY(180deg);background:#fff;border:3px solid var(--ink);transform:rotateY(180deg);font-size:18px;line-height:1.5}
.flip.on .front{transform:rotateY(-180deg);animation:none}
.flip.on .back{transform:rotateY(0)}
.flip.opened .front{animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,45,133,0);transform:scale(1)}50%{box-shadow:0 0 21px 6px rgba(255,45,133,.75);transform:scale(1.015)}}
/* mistakes */
.mist{background:var(--coral);color:#fff;border-radius:18px;padding:16px 18px;margin:14px 0;font-size:17px;line-height:1.5}
.mist .row{display:flex;gap:10px;align-items:baseline;margin:4px 0}
.mist .tag{flex:none;background:#fff;color:var(--coral);border-radius:8px;padding:1px 8px;font-weight:900;font-size:14px}
.mist .ok .tag{color:var(--green)}
.mist .why{background:#ffffff26;border-radius:10px;padding:8px 10px;margin-top:8px}
.mist s{text-decoration-thickness:2px}
/* questions */
.q{background:#fff;border-radius:18px;padding:18px;margin:16px 0;border:3px solid #dcdff7;position:relative}
.q.done{border-color:var(--green)}
.q.locked{border-color:var(--coral)}
.q .qn{font-family:'Bungee';font-size:15px;color:var(--blue);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q .qt{font-size:20px;line-height:1.55}
.q .ansrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.q input{font-size:20px;font-weight:800;padding:10px 12px;border:3px solid #c6cbef;border-radius:12px;width:230px;max-width:62vw;font-family:inherit;color:var(--ink)}
.q input::placeholder{font-size:16px;font-weight:700}
.q input:focus{outline:none;border-color:var(--blue)}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:900;font-size:16px}
.btn.go{background:var(--blue);color:#fff}
.btn.hint{background:#FFF1CC;color:#8a5a00;border:2px solid var(--amber)}
.btn.hint.nudge{animation:nudge 1s ease-in-out infinite}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(255,182,39,0)}50%{box-shadow:0 0 16px 5px rgba(255,182,39,.9)}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.opt{border:3px solid #c6cbef;background:var(--field);border-radius:14px;padding:13px 14px;text-align:left;font-weight:800;font-size:19px;color:var(--ink);min-height:54px}
@media (hover:hover){.opt:hover{border-color:var(--blue)}.sopt:hover{border-color:var(--pink)}}
.opt.bad{background:#FFE1DC;border-color:var(--coral);opacity:.7;text-decoration:line-through}
.opt.good{background:#D8F7E3;border-color:var(--green)}
.opt:disabled{cursor:default}
.hintbox{background:#FFF7DD;border:2px dashed var(--amber);border-radius:12px;padding:10px 12px;margin-top:12px;font-weight:700}
.fb{margin-top:12px;border-radius:12px;padding:10px 12px;font-weight:800}
.fb.ok{background:#D8F7E3;color:#0c6b31}
.fb.no{background:#FFE1DC;color:#a3261a}
.sol{background:#F1F3FF;border-left:6px solid var(--blue);border-radius:10px;padding:10px 14px;margin-top:10px}
.sol .h{font-weight:900;color:var(--blue)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
/* diagrams */
.dia{width:100%;max-width:max(330px,min(680px,calc((100vh - 230px) * var(--ar,1.5))));max-width:max(330px,min(680px,calc((100dvh - 230px) * var(--ar,1.5))));height:auto;display:block;background:#fff;border-radius:14px;border:2px solid #dcdff7;margin:12px auto;touch-action:manipulation}
.dia .lab{font-family:'Nunito';font-weight:900;font-size:23px}
.dia text{font-family:'Nunito';font-weight:800}
.dg path.hit,.dg line.hit{pointer-events:stroke}
.dg circle.hit,.dg rect.hit{pointer-events:all}
.dg.glow path:not(.hit),.dg.glow line,.dg.glow polyline,.dg.glow rect:not(.hit),.dg.glow polygon,.dg.glow circle:not(.hit){stroke:var(--pink)!important;stroke-width:5!important}
.dg.glow text{fill:var(--pink)!important}
.dg.glow .reveal text{fill:#fff!important}
.dg.glow .reveal rect{fill:#FF2D85!important;stroke:#fff!important;stroke-width:2!important}
.dg.glow{filter:drop-shadow(0 0 5px rgba(255,45,133,.9));animation:glowp 1.6s ease-in-out infinite}
@keyframes glowp{50%{filter:drop-shadow(0 0 11px rgba(255,45,133,1))}}
.dg.fillglow.glow rect:not(.hit),.dg.fillglow.glow path:not(.hit){fill:rgba(255,45,133,.25)!important}
.tapping [data-tap]{cursor:pointer}
.tapping [data-tap] .hit{fill:rgba(58,107,255,.08);stroke:rgba(58,107,255,.35)}
.tapping [data-tap] path.hit{fill:none;stroke:rgba(58,107,255,.18)}
[data-tap].bad{animation:shake .4s}
.tp .dot2,.tp .reveal{opacity:0;transition:opacity .3s}
.tp.glow .dot2,.tp.glow .reveal{opacity:1}
.gap{display:inline-block;width:1.4em;height:1.1em;border:2.5px dashed #FF2D85;border-radius:5px;vertical-align:-2px;margin:0 2px}
.sf .fr{font-size:1.15em;font-weight:900}
.streak{position:fixed;left:50%;top:calc(var(--head-h) + 60px);transform:translateX(-50%) scale(.6);background:linear-gradient(90deg,#FF5A45,#FFB627);color:#fff;font-family:'Bungee';font-size:26px;padding:10px 22px;border-radius:18px;opacity:0;pointer-events:none;z-index:56;transition:.35s}
.streak.on{opacity:1;transform:translateX(-50%) scale(1)}
/* guided example */
.we-q{background:var(--ink);color:#fff;border-radius:18px;padding:18px;font-size:20px;line-height:1.55}
.we-q b{color:var(--amber)}
.steps-done{margin:14px 0}
.sdone{background:#fff;border:3px solid var(--green);border-radius:14px;padding:12px 14px;margin:10px 0}
.sdone .st{font-weight:900;color:var(--green)}
.sdone.fresh{animation:lift .7s cubic-bezier(.4,0,.2,1)}
@keyframes lift{0%{transform:translateY(40px);opacity:0;box-shadow:0 0 0 0 rgba(31,182,90,0)}60%{opacity:1;box-shadow:0 0 22px 6px rgba(31,182,90,.7)}100%{transform:none}}
.pick-h{font-family:'Bungee';font-size:17px;margin:18px 0 6px;color:var(--pink)}
.steppick{display:grid;gap:10px}
.sopt{border:3px solid #c6cbef;background:#fff;border-radius:14px;padding:13px 14px;text-align:left;font-weight:800;font-size:19px;color:var(--ink)}
.tapbox{background:#E4ECFF;border:3px solid var(--blue);border-radius:14px;padding:12px 14px;font-weight:900;margin:12px 0}
.msg{margin-top:10px;border-radius:12px;padding:10px 12px;font-weight:800}
.dtiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0;max-width:620px}
.dtile{background:#fff;color:var(--ink);border-radius:12px;padding:6px 4px 8px;text-align:center;border:3px solid var(--amber)}
.dtile small{display:block;white-space:nowrap;font-size:12.5px;font-weight:800;color:#6a6f99}
.dtile span{display:block;font-size:30px;font-weight:900;line-height:1.1}
.dnote{background:#ffffff1f;border-radius:10px;padding:8px 12px;margin:0 0 12px;font-size:16px}
/* boss */
.arena{background:radial-gradient(circle at 50% 30%,#4a2f8f,var(--ink) 70%);color:#fff;border-radius:22px;padding:20px;text-align:center;margin:12px 0;position:relative;overflow:hidden}
.arena .bemoji{font-size:84px;line-height:1.1;display:inline-block;animation:hover 2.4s ease-in-out infinite}
.arena .bemoji.hitme{animation:bossHit .6s}
.arena .bemoji.dead{filter:grayscale(1);transform:rotate(90deg);animation:none;opacity:.6}
@keyframes hover{50%{transform:translateY(-8px)}}
@keyframes bossHit{0%{transform:scale(1)}30%{transform:scale(.8) rotate(-12deg);filter:brightness(3)}60%{transform:scale(1.1) rotate(8deg)}100%{transform:none}}
.arena .bname{font-family:'Bungee';font-size:22px;margin-top:6px;color:var(--amber)}
.arena .taunt{font-style:italic;opacity:.85;margin:4px 0 10px}
.hp{height:26px;background:#ffffff26;border-radius:999px;overflow:hidden;border:3px solid #fff;max-width:520px;margin:8px auto}
.hp>div{height:100%;background:linear-gradient(90deg,#ff2d85,#ff5a45);transition:width .8s cubic-bezier(.4,0,.2,1)}
.hpl{font-weight:900}
.stars{font-size:30px;letter-spacing:4px}
.victory{background:var(--amber);color:var(--ink);border-radius:14px;padding:10px;margin-top:12px;font-weight:900}
/* menu */
.hero{background:var(--ink);color:#fff;border-radius:24px;padding:22px 20px;margin-top:6px}
.hero h1{font-size:30px;margin:0 0 6px;line-height:1.15}
.hero p{margin:4px 0;font-size:17px}
.bar{height:12px;background:#ffffff33;border-radius:999px;overflow:hidden;margin-top:10px}
.bar>div{height:100%;background:var(--teal)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.lvl{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px;text-align:left;color:var(--ink);display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 var(--ink);transition:transform .1s}
.lvl:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.lvl .le{font-size:40px;flex:none}
.lvl .ln{font-family:'Bungee';font-size:13px;color:var(--pink)}
.lvl .lt{font-weight:900;font-size:17px;line-height:1.2}
.lvl .lb{height:8px;background:#e4e6f7;border-radius:999px;overflow:hidden;margin-top:7px}
.lvl .lb>div{height:100%;background:var(--teal)}
.lvl .ls{font-size:13px;font-weight:800;opacity:.75;margin-top:4px}
.lvl.final{grid-column:1/-1;background:var(--ink);color:#fff;border-color:var(--pink);box-shadow:0 5px 0 var(--pink)}
.lvl.final .ln{color:var(--amber)}
.mrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.mbtn{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:10px 14px;font-weight:900;color:var(--ink)}
/* intro */
.legend{display:grid;gap:12px;margin-top:12px}
.leg{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:16px;padding:14px;border:2px solid #dcdff7}
.leg .li{font-size:30px;flex:none;width:44px;text-align:center}
.leg b{display:block;font-size:17px}
/* summary */
.shot{background:var(--pink);color:#fff;border-radius:18px;padding:16px;text-align:center;font-family:'Bungee';font-size:21px;animation:pulse 1.8s infinite;margin:10px 0}
.shot small{display:block;font-family:'Nunito';font-weight:800;font-size:15px;margin-top:4px}
.sumsec{background:#fff;border-radius:18px;border:3px solid var(--ink);padding:16px;margin:16px 0}
.sumsec h3{margin:0 0 8px;font-size:18px;color:var(--blue)}
.sumsec .fact{border-bottom:1px dashed #cfd3f2;padding:10px 0}
.sumsec .fact:last-child{border-bottom:0}
.sumsec .fq{font-weight:900;color:var(--pink);margin-bottom:3px}
.sumsec ol{margin:6px 0;padding-left:22px}
.sumsec ol li{margin:3px 0}
.smist{background:#FFE8E4;border-left:6px solid var(--coral);border-radius:8px;padding:6px 10px;margin:6px 0}
/* modal, laser, toast */
#modal{position:fixed;inset:0;background:rgba(20,14,50,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:20px;padding:22px;max-width:420px;width:100%}
#modal .box h3{margin-top:0}
#laserBtn{position:fixed;right:12px;bottom:calc(var(--foot-h) + var(--tb-h) + 12px + env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:999px;width:46px;height:46px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:20px;opacity:.75}
#laserBtn.on{background:var(--coral);opacity:1}
#laser{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#ff1f1f;box-shadow:0 0 14px 6px rgba(255,40,40,.75);pointer-events:none;z-index:60;display:none}
#toast{position:fixed;left:50%;top:calc(var(--head-h) + 12px);transform:translateX(-50%) translateY(-20px);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-weight:900;opacity:0;transition:.3s;z-index:55;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.confetti{position:absolute;width:10px;height:14px;top:-20px;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0}}
body.kb footer,body.kb #laserBtn{display:none}
@media (max-width:560px){.hero h1{font-size:24px}.arena .bemoji{font-size:66px}footer .nav{padding:10px 12px}body{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{#laserBtn,#laser,#toolbar,footer,header .hbtn{display:none!important}body{display:block;height:auto;overflow:visible}#main{overflow:visible}}
</style>
</head>
<body>
<header>
  <button class="hbtn" id="mapBtn" aria-label="Level map">🗺️ Map</button>
  <div class="ttl" id="ttl">3G2 EOY Boss Rush</div>
  <div class="chip" id="xp">⭐ 0 XP</div>
</header>
<main id="main"><div class="wrap" id="view"></div></main>
<div id="toolbar"></div>
<footer>
  <button class="nav" id="backBtn">◀ Back</button>
  <div id="dots"></div>
  <button class="nav" id="nextBtn">Next ▶</button>
</footer>
<button id="laserBtn" aria-label="Laser pointer">🔴</button>
<div id="laser"></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<script>
/* ================= helpers ================= */
function F(n,d){return `<span class="fr"><span>${n}</span><span>${d}</span></span>`}
const N=(q,ans,hint,sol,o={})=>Object.assign({type:'num',q,ans,hint,sol},o);
const M=(q,opts,hint,sol,o={})=>Object.assign({type:'mcq',q,opts,hint,sol},o);
const st=(t,w,o={})=>Object.assign({t,w},o);
const R2=v=>Math.round(v*10)/10;

/* ---- SVG diagram helpers ---- */
function svg(w,h,inner){return `<svg class="dia" style="--ar:${(w/h).toFixed(3)}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`}
function ln(a,b,o={}){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${o.c||'#231942'}" stroke-width="${o.w||3}" ${o.dash?'stroke-dasharray="8 6"':''} stroke-linecap="round"/>`}
function tx(x,y,t,o={}){return `<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" dominant-baseline="middle" font-size="${Math.round((o.s||18)*1.2)}" fill="${o.c||'#231942'}" ${o.cls?`class="${o.cls}"`:''}>${t}</text>`}
function G(inner,o={}){return `<g class="dg ${o.cls||''} ${o.tap?'tp':''}" ${o.g?`data-g="${o.g}"`:''} ${o.tap?`data-tap="${o.tap}"`:''}>${inner}</g>`}
function arcD(V,P1,P2,r){
  const a1=Math.atan2(P1[1]-V[1],P1[0]-V[0]),a2=Math.atan2(P2[1]-V[1],P2[0]-V[0]);
  let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<=-Math.PI)d+=2*Math.PI;
  const s=[V[0]+r*Math.cos(a1),V[1]+r*Math.sin(a1)],e=[V[0]+r*Math.cos(a1+d),V[1]+r*Math.sin(a1+d)];
  return {d:`M${s[0].toFixed(1)},${s[1].toFixed(1)} A${r},${r} 0 0 ${d>0?1:0} ${e[0].toFixed(1)},${e[1].toFixed(1)}`,mid:a1+d/2};
}
function ang(V,P1,P2,o={}){
  const r=o.r||30,a=arcD(V,P1,P2,r),L=o.lr||(r+24),c=o.c||'#e0115f';
  const lx=V[0]+L*Math.cos(a.mid),ly=V[1]+L*Math.sin(a.mid);
  let inner='';

function rightMark(V,P1,P2,s=14){

}
function tick(A,B,n=1){ // tick marks at midpoint
  const m=[(A[0]+B[0])/2,(A[1]+B[1])/2],dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),px=-dy/L*10,py=dx/L*10,ux=dx/L,uy=dy/L;
  let s='';for(let i=0;i<n;i++){const o=(i-(n-1)/2)*7;s+=ln([m[0]+ux*o-px,m[1]+uy*o-py],[m[0]+ux*o+px,m[1]+uy*o+py],{w:3})}

}
function polyAngles(P,labels,o={}){ // interior arcs for convex polygon given in order

}
function vname(P,names,center){return names.map((nm,i)=>{const dx=P[i][0]-center[0],dy=P[i][1]-center[1],L=Math.hypot(dx,dy);return tx(P[i][0]+dx/L*20,P[i][1]+dy/L*20,nm,{s:19})}).join('')}
function grid(o){

  const X=x=>pad+(x-xmin)*u,Y=y=>pad+(ymax-y)*u;let s='';

  s+=`<defs><marker id="ar${o.id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#231942"/></marker></defs>`;
  const ax=`<line x1="${X(xmin)-14}" y1="${Y(0)}" x2="${X(xmax)+14}" y2="${Y(0)}" stroke="#231942" stroke-width="2.5" marker-end="url(#ar${o.id})"/><line x1="${X(0)}" y1="${Y(ymin)-(-14)}" x2="${X(0)}" y2="${Y(ymax)-14}" stroke="#231942" stroke-width="2.5" marker-end="url(#ar${o.id})"/>`;
  s+=o.axisG?G(ax,{g:o.axisG}):ax;
  s+=tx(X(xmax)+22,Y(0)-14,'x',{s:18})+tx(X(0)+16,Y(ymax)-18,'y',{s:18});
  for(let x=xmin;x<=xmax;x++)if(x!==0)s+=tx(X(x),Y(0)+16,String(x).replace('-','−'),{s:14,c:'#4b4f7a'});
  for(let y=ymin;y<=ymax;y++)s+=tx(X(0)-12,Y(y)+(y===0?14:0),String(y).replace('-','−'),{s:14,c:'#4b4f7a',a:'end'});
  s+=`<clipPath id="cp${o.id}"><rect x="${X(xmin)}" y="${Y(ymax)}" width="${(xmax-xmin)*u}" height="${(ymax-ymin)*u}"/></clipPath>`;
  (o.lines||[]).forEach(L=>{const x1=xmin-1,x2=xmax+1;s+=`<g clip-path="url(#cp${o.id})">${G(ln([X(x1),Y(L.m*x1+L.c)],[X(x2),Y(L.m*x2+L.c)],{c:L.col||'#3A6BFF',w:3.5,dash:L.dash}),{g:L.g})}</g>`;
    if(L.label)s+=tx(X(L.lx),Y(L.ly),L.label,{s:17,c:L.col||'#3A6BFF',a:'start'});});
  (o.curves||[]).forEach(C=>{let d='',pen=false;const a=C.from!==undefined?C.from:xmin-0.5,b=C.to!==undefined?C.to:xmax+0.5,stp=(b-a)/400;
    for(let x=a;x<=b+1e-9;x+=stp){const y=C.f(x);if(!isFinite(y)||y>ymax+4||y<ymin-4){pen=false;continue}d+=(pen?'L':'M')+X(x).toFixed(1)+','+Y(y).toFixed(1)+' ';pen=true}
    s+=`<g clip-path="url(#cp${o.id})">${G(`<path d="${d}" fill="none" stroke="${C.col||'#3A6BFF'}" stroke-width="3.5"/>`,{g:C.g})}</g>`;
    if(C.label)s+=tx(X(C.lx),Y(C.ly),C.label,{s:17,c:C.col||'#3A6BFF',a:'start'});});

 ]},
{title:'Zero and negative indices',

{title:'Fractional indices',
 cards:[
  ['What does a to the power 1/n mean?',`The <span class="kw">n<sup>th</sup> root</span>.<div class="wk"><div>${P('a',1,2)} = √a</div><div>${P('a',1,3)} = ∛a</div><div>${P(8,1,3)} = 2</div></div>`],
  ['What about a to the power m/n?',`<span class="kw">Root first, then power</span>.<div class="wk"><div>${P('a','m','n')} = (<sup>n</sup>√a)<sup>m</sup></div><div>${P(8,2,3)} = (∛8)<sup>2</sup> = 2<sup>2</sup> = 4</div></div>`]

{title:'Solving index equations',

subs:[
{title:'Enlargement and reduction',

 ],

 ],

 ]},
{title:'Congruence and similarity',

  ['Congruence tests?',`<div class="wk"><div>SSS: 3 sides</div><div>SAS: 2 sides + angle between them</div><div>ASA / AAS: 2 angles + 1 side</div><div>RHS: right angle, hypotenuse, side</div></div>`],

   s+=G(ang(D,A,E,{r:26,lr:0,c:'#e0115f'})+ang(B,A,C,{r:26,lr:0,c:'#e0115f'}),{g:'corr'});
   s+=G(ang(A,B,C,{r:32,lr:0,c:'#3A6BFF'}),{g:'angA'});
   s+=tx(250,14,'A',{s:18})+tx(44,300,'B',{s:18})+tx(456,300,'C',{s:18})+tx(158,128,'D',{s:18})+tx(344,128,'E',{s:18});
   s+=tx(196,76,'4',{s:18,a:'end'})+tx(108,210,'6',{s:18,a:'end'})+tx(250,120,'6',{s:18})+tx(250,312,'?',{s:20,c:'#e0115f'});
   return svg(500,325,s)})(),
  steps:[

   st('Find AB',['AB = 4 + 6 = 10 cm'],{hint:'Which two lengths make up AB?'}),
   st('Match corresponding sides',['AD ↔ AB','DE ↔ BC'],{hint:'Which side of the big triangle matches each side of the small one?'}),
   st('Write the ratio equation',[`${F('BC',6)} = ${F(10,4)}`],{hint:'How do you write the two equal ratios, big side over small side?'})
  ],
  wrong:['The triangles are congruent',`${F('BC',6)} = ${F(4,10)}`,'Use BC = 6 + (10 − 4)'],

 ]},

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seeded(seed){let a=seed||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,seedStr){const r=seeded(hash(seedStr)),a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function parseStudentNumber(raw){
  if(raw===null||raw===undefined)return NaN;
  let s=String(raw).trim().replace(/[\u2212\u2010\u2011\u2012\u2013\u2014\u2015\uFE63\uFF0D]/g,'-');
  s=s.replace(/(\d),(\d{3})(?!\d)/g,'$1$2').replace(/,/g,'.');
  s=s.replace(/(\d)\s*\/\s*(-?\d)/g,'$1\u00a7$2').replace(/\//g,' ').replace(/\u00a7/g,'/');
  s=s.replace(/[^0-9.\-\/ ]/g,' ').trim();
  let m=s.match(/^(-?)\s*(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){const v=+m[2]+ +m[3]/+m[4];return m[1]?-v:v}
  s=s.replace(/\s+/g,'');
  m=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if(m){const d=parseFloat(m[2]);return d===0?NaN:parseFloat(m[1])/d}
  if(!/^-?\d*\.?\d+$/.test(s))return NaN;
  return parseFloat(s);
}
function A(id){return S.ans[id]||(S.ans[id]={tries:0,done:false,pts:0,locked:false,wrong:[],hint:false})}
function totalXP(){return Object.values(S.ans).reduce((a,b)=>a+(b.pts||0),0)}
function topicStats(t){let d=0,f=0;t.qids.forEach(id=>{const a=S.ans[id];if(a&&a.done){d++;if(a.pts===10)f++}});return{done:d,total:t.qids.length,first:f}}
function bossStats(t){const n=t.bossQs.length;let dmg=0,done=0,first=0,lockedOut=0;
  t.bossQs.forEach(q=>{const a=S.ans[q.id];if(!a)return;if(a.done){done++;if(a.pts>0)dmg+=100/n;if(a.pts===10)first++}if(a.locked&&!a.done)lockedOut++;if(a.locked&&a.done)lockedOut++});
  const hp=Math.max(0,Math.round(100-dmg));const finished=t.bossQs.every(q=>S.ans[q.id]&&S.ans[q.id].done);
  const stars=!finished?0:(first===n?3:first>=Math.ceil(n/2)?2:1);
  return{hp,done,n,first,finished,stars,defeated:finished&&hp<=0}}

      <div class="ln">${tp.id==='final'?'Final boss':'Level '+tp.n}</div><div class="lt">${tp.title}</div>
      <div class="lb"><div style="width:${s.done/s.total*100}%"></div></div>
      <div class="ls">${s.done}/${s.total} cleared ${b.finished?' · '+'⭐'.repeat(b.stars):''}</div></div></button>`}).join('')}</div>`;
  view.querySelectorAll('[data-lvl]').forEach(b=>b.onclick=()=>{S.view='topic';S.topic=b.dataset.lvl;S.page=(S.seen[S.topic+'_last']||0);save();toTop();render()});
  $('#howBtn').onclick=()=>{S.view='intro';save();toTop();render()};
  $('#resetBtn').onclick=()=>modal(`<h3>Reset all progress?</h3><p>This clears your XP, answers and boss stars on this device. It can't be undone.</p><div class="mrow"><button class="btn go" id="mYes" style="background:var(--coral)">Yes, reset</button><button class="btn hint" id="mNo">Cancel</button></div>`,()=>{$('#mYes').onclick=()=>{S=fresh();S.view='menu';S.seenIntro=true;save();closeModal();toTop();render();toast('Progress reset')};$('#mNo').onclick=closeModal});
  setNav(null,null,'<span style="color:#fff;font-weight:800;opacity:.8">Tap a level to start</span>');
}
function modal(html,after){$('#modalBox').innerHTML=html;$('#modal').classList.add('on');after&&after()}
function closeModal(){$('#modal').classList.remove('on')}

function pageLabel(t,p){const s=p.s!==undefined?t.subs[p.s]:null;
  return {intro:'Level briefing',recap:`Recap · ${s&&s.title}`,we:`Guided example · ${s&&s.title}`,practice:`Practice · ${s&&s.title}`,boss:'Boss checkpoint',summary:'Summary'}[p.type]}
function renderTopic(){
  const t=TMAP[S.topic];if(!t){S.view='menu';return render()}
  if(S.page>=t.pages.length)S.page=0;
  const p=t.pages[S.page];S.seen[t.id+'_'+S.page]=1;S.seen[t.id+'_last']=S.page;save();
  $('#ttl').innerHTML=`${t.id==='final'?'Final boss':'Level '+t.n} · ${t.title}<small>${pageLabel(t,p)}</small>`;
  let h='';
  if(p.type==='intro')h=pIntro(t);
  else if(p.type==='recap')h=pRecap(t,t.subs[p.s],p.s);
  else if(p.type==='we')h=pWE(t,t.subs[p.s]);
  else if(p.type==='practice')h=pPractice(t,t.subs[p.s],p.s);
  else if(p.type==='boss')h=pBoss(t);
  else h=pSummary(t);
  view.innerHTML=h;
  if(p.type==='we')wireWE(t.subs[p.s].we);
  const dots=t.pages.map((pg,i)=>`<button class="dot ${i===S.page?'cur':S.seen[t.id+'_'+i]?'seen':''} ${pg.type==='boss'?'boss':''}" data-pg="${i}" aria-label="Page ${i+1}"></button>`).join('');
  const last=S.page===t.pages.length-1;
  setNav(S.page>0?()=>go(S.page-1):()=>{S.view='menu';save();toTop();render()},
    {label:last?'Map 🗺️':'Next ▶',fn:last?()=>{S.view='menu';save();toTop();render()}:()=>go(S.page+1)},dots);
  $('#backBtn').style.visibility='visible';$('#backBtn').textContent=S.page>0?'◀ Back':'◀ Map';
  $('#dots').querySelectorAll('.dot').forEach(d=>d.onclick=()=>go(+d.dataset.pg));
}
function go(i){S.page=i;save();toTop();render()}

function flipcards(cards){return `<div class="cards">${cards.map(c=>`<div class="flip" role="button" tabindex="0" onclick="this.classList.toggle('on');this.classList.add('opened')"><div class="face front">${c[0]}<div class="tap">👆 Tap to flip</div></div><div class="face back">${c[1]}</div></div>`).join('')}</div>`}
function mistakes(ms){return ms.map(m=>`<div class="mist"><div class="row"><span class="tag">✗ Wrong</span><span><s>${m.w}</s></span></div><div class="row ok"><span class="tag">✓ Right</span><span>${m.r}</span></div><div class="why">💭 ${m.y}</div></div>`).join('')}
function pIntro(t){
  if(t.id==='final')return `<div class="arena"><div class="bemoji">${t.boss.emoji}</div><div class="bname">${t.boss.name}</div><div class="taunt">"${t.boss.taunt}"</div>
   <p>${t.bossQs.length} questions, one from every topic. Every correct answer is a hit.</p></div>
   <div class="card lead">Tip: Revisit a level's Summary page if you get stuck. Tap Next ▶ when you're ready.</div>`;
  return `<div class="arena"><div class="bemoji">${t.boss.emoji}</div><div class="bname">${t.boss.name}</div><div class="taunt">"${t.boss.taunt}"</div>
   <p>Beat the ${t.subs.length} training rooms, then defeat me at the checkpoint.</p></div>
   <div class="card"><div class="sec-title" style="margin-top:0">Training rooms</div>
   ${t.subs.map((s,i)=>`<p class="lead" style="margin:8px 0"><b>${i+1}.</b> ${s.title}</p>`).join('')}
   <p class="lead" style="margin-top:14px">Each room has: 🃏 recap cards + ⚠️ mistakes → 🧭 guided example → ✏️ practice.</p></div>`;
}
function pRecap(t,s,i){
  return `<div class="sec-title">🃏 ${s.title}</div><p class="lead">Try to answer each card in your head first, then tap to check.</p>
  ${flipcards(s.cards)}
  <div class="sec-title">⚠️ Common mistakes</div>${mistakes(s.mistakes)}`;
}
function pPractice(t,s,i){
  return `<div class="sec-title">✏️ Practice · ${s.title}</div><p class="lead">2 tries each. Use 💡 Hint if you're stuck.</p>${s.practice.map((q,j)=>qHTML(q,`Q${j+1}`)).join('')}`;
}

/* ---- question block ---- */
function qHTML(q,label){
  const a=A(q.id);let body='';
  if(q.type==='mcq'){
    const order=shuf(q.opts.map((o,i)=>i),q.id);
    body=`<div class="opts">${order.map(i=>{const bad=a.wrong.includes(i),good=a.done&&i===0;
      return `<button class="opt ${bad?'bad':''} ${good?'good':''}" data-q="${q.id}" data-i="${i}" ${bad||a.done?'disabled':''}>${q.opts[i]}</button>`}).join('')}</div>`;
  }else{
    body=`<div class="ansrow">${q.pre?`<b style="font-size:19px">${q.pre}</b>`:''}<input inputmode="decimal" enterkeyhint="go" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-in="${q.id}" placeholder="Type your answer" value="${a.done?(a.val||''):(a.lastVal||'')}" ${a.done?'disabled':''}>${q.suf?`<b style="font-size:19px">${q.suf}</b>`:''}
      ${a.done?'':`<button class="btn go" data-sub="${q.id}">Check</button>`}</div>`;
  }
  let fb='';
  if(a.done){fb=a.pts===10?`<div class="fb ok">🎉 Correct on the first try! +10 XP</div>`:a.pts===5?`<div class="fb ok">✅ Got it on the 2nd try! +5 XP</div>`:`<div class="fb ok">✅ Correct now. Well done for sticking with it! (No XP this time)</div>`}
  else if(a.locked){fb=`<div class="fb no">Two tries used. Study the working below, then check it with a friend or your teacher 🙋. You can still answer (no XP).</div>`}
  else if(a.tries===1){fb=`<div class="fb no">❌ Not quite. Tap 💡 Hint and try once more!</div>`}
  const sol=(a.locked||a.done&&a.tries>0)&&q.sol?`<div class="sol"><div class="h">Full working</div><div class="wk">${q.sol.map(l=>`<div>${l}</div>`).join('')}</div></div>`:'';
  const hint=q.hint?`<div style="margin-top:12px"><button class="btn hint ${a.tries===1&&!a.done&&!a.hint?'nudge':''}" data-hint="${q.id}">💡 Hint</button>${a.hint?`<div class="hintbox">💡 ${q.hint}</div>`:''}</div>`:'';
  return `<div class="q ${a.done?'done':''} ${a.locked&&!a.done?'locked':''}" data-qid="${q.id}">
    <div class="qn">${label}${q.think?'<span class="pill badge-think">💭 Think</span>':''}${q.boss?'<span class="pill" style="background:#231942;color:#fff">👾 Boss hit</span>':''}</div>
    <div class="qt">${q.q}</div>${q.dia||''}${body}${fb}${a.done?'':hint}${sol}</div>`;
}
function refreshQ(id){
  const el=view.querySelector(`[data-qid="${id}"]`);if(!el)return;
  const q=QMAP[id];const lab=el.querySelector('.qn').childNodes[0].textContent;
  el.outerHTML=qHTML(q,lab);updXP();
  const t=TMAP[S.topic];if(t&&t.pages[S.page].type==='boss')refreshArena(t,id);
  if(t&&t.pages[S.page].type==='we')afterWEFinal();
}
function submit(id,val){
  const q=QMAP[id],a=A(id);if(a.done)return;
  let ok;
  if(q.type==='mcq'){ok=val===0}
  else{const v=parseStudentNumber(val);if(isNaN(v)){toast('Type a number first');return}
    const answers=Array.isArray(q.ans)?q.ans:[q.ans];ok=answers.some(x=>Math.abs(v-x)<=(q.tol!==undefined?q.tol:1e-6))}
  if(ok){a.done=true;a.pts=a.locked?0:(a.tries===0?10:5);a.val=val;toast(a.pts?`+${a.pts} XP!`:'Correct!');
    if(a.pts===10){S.streak=(S.streak||0)+1;if(S.streak>=3)showStreak(S.streak)}else S.streak=0}
  else{S.streak=0;a.tries++;if(q.type==='mcq')a.wrong.push(val);else a.lastVal=val;if(a.tries>=2)a.locked=true}
  save();refreshQ(id);
  if(!ok){const el=view.querySelector(`[data-qid="${id}"]`);el&&el.classList.add('shake')}
}
view.addEventListener('click',e=>{
  const o=e.target.closest('.opt');if(o&&!o.disabled){submit(o.dataset.q,+o.dataset.i);return}
  const sb=e.target.closest('[data-sub]');if(sb){const inp=view.querySelector(`[data-in="${sb.dataset.sub}"]`);submit(sb.dataset.sub,inp.value);return}
  const hb=e.target.closest('[data-hint]');if(hb){A(hb.dataset.hint).hint=true;save();refreshQ(hb.dataset.hint);return}
});
view.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.in){submit(e.target.dataset.in,e.target.value)}});
let lastInput=null;view.addEventListener('focusin',e=>{if(e.target.tagName==='INPUT')lastInput=e.target});

/* ---- guided worked example ---- */
function W(id){return S.we[id]||(S.we[id]={n:0,tapped:[],msg:''})}
function pWE(t,s){
  const we=s.we;
  return `<div class="sec-title">🧭 Guided example · ${s.title}</div>
   <p class="lead">Build the solution one step at a time. Pick the correct <span class="kw">next</span> step.</p>
   <div class="we-q">${we.q}</div><div id="weDia">${we.dia||''}</div><div id="weBody"></div>`;
}
function wireWE(we){drawWE(we)}
function drawWE(we,fresh=-1){
  const w=W(we.id),body=$('#weBody');if(!body)return;
  const dia=$('#weDia');
  if(dia){dia.querySelectorAll('[data-g]').forEach(g=>g.classList.remove('glow'));
    we.steps.slice(0,w.n).forEach((s,i)=>{(s.glow?[].concat(s.glow):[]).forEach(k=>dia.querySelectorAll(`[data-g="${k}"]`).forEach(el=>el.classList.add('glow')))});
    w.tapped.forEach(k=>dia.querySelectorAll(`[data-tap="${k}"]`).forEach(el=>el.classList.add('glow')));}
  const tapsLeft=(s)=>s.tap?(s.tap.seq||[s.tap]).some(t=>!w.tapped.includes(t.target)):false;
  let h=`<div class="steps-done">${we.steps.slice(0,w.n).map((s,i)=>`<div class="sdone ${i===fresh?'fresh':''}"><div class="st">✓ Step ${i+1}: ${s.t}</div>${s.w&&s.w.length&&!tapsLeft(s)?`<div class="wk">${s.w.map(l=>`<div>${l}</div>`).join('')}</div>`:''}</div>`).join('')}</div>`;
  const lastSt=w.n>0?we.steps[w.n-1]:null,taps=lastSt&&lastSt.tap?(lastSt.tap.seq||[lastSt.tap]):[];
  const curTap=taps.find(t=>!w.tapped.includes(t.target));const pendingTap=!!curTap;
  if(dia)dia.classList.toggle('tapping',!!pendingTap);
  if(pendingTap){
    h+=`<div class="tapbox">👆 ${curTap.prompt}${taps.length>1?` <span style="opacity:.7">(${taps.indexOf(curTap)+1} of ${taps.length})</span>`:''}</div>`;
  }else if(w.n<we.steps.length){
    const pool=we.steps.slice(w.n).map((s,k)=>({t:s.t,k:w.n+k})).concat(we.wrong.map(x=>({t:x,k:-1})));
    const order=shuf(pool,we.id+'_'+w.n);
    h+=`<div class="pick-h">Pick step ${w.n+1}</div><div class="steppick">${order.map(o=>`<button class="sopt" data-k="${o.k}">${o.t}</button>`).join('')}</div>`;
    if(w.msg)h+=`<div class="msg fb no">${w.msg}</div>`;
  }else{
    h+=`<div class="pick-h">Final step: your answer</div>${qHTML(we.final,'Answer')}`;
  }
  body.innerHTML=h;
  body.querySelectorAll('.sopt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(k===w.n){w.n++;w.msg='';save();drawWE(we,w.n-1);
      const nb=body.querySelector('.sdone.fresh');nb&&nb.scrollIntoView({behavior:'smooth',block:'center'});}
    else{b.classList.add('shake');
      w.msg=k>w.n?'⏩ That step comes later! What must you do before it?':'🤔 '+(we.steps[w.n].hint||'Not this one. Ask yourself: what do you need to know or do first?');
      save();setTimeout(()=>drawWE(we),420);}
  });
  if(pendingTap&&dia){
    dia.querySelectorAll('[data-tap]').forEach(el=>el.onclick=()=>{
      const tg=curTap.target;
      if(el.dataset.tap===tg){w.tapped.push(tg);save();drawWE(we);toast('Nice spot! ✨')}
      else if(!w.tapped.includes(el.dataset.tap)){el.classList.remove('bad');void el.getBBox();el.classList.add('bad');toast(curTap.hint||'Not that one. Look again!')}
    });
  }else if(dia){dia.querySelectorAll('[data-tap]').forEach(el=>el.onclick=null)}
}
function afterWEFinal(){}

/* ---- boss ---- */
function arenaHTML(t){const b=bossStats(t);
  return `<div class="bemoji ${b.defeated?'dead':''}" id="bossE">${t.boss.emoji}</div><div class="bname">${t.boss.name}</div>
   <div class="hp"><div style="width:${b.hp}%"></div></div><div class="hpl">HP ${b.hp} / 100 · ${b.done}/${b.n} answered</div>
   ${b.finished?`<div class="stars">${'⭐'.repeat(b.stars)}${'☆'.repeat(3-b.stars)}</div><div class="victory">${b.defeated?`🏆 ${t.boss.name} is defeated! ${b.first}/${b.n} on the first try.`:`${t.boss.name} escaped with ${b.hp} HP. Check the working you missed, then try the Summary page.`}</div>`:`<div class="taunt">"${t.boss.taunt}"</div>`}`;
}
function pBoss(t){
  return `<div class="arena" id="arena">${arenaHTML(t)}</div>
   <p class="lead">Correct answer = 💥 hit. First-try answers earn stars. 2 tries each, as usual.</p>
   ${t.bossQs.map((q,j)=>qHTML(q,`Attack ${j+1}`)).join('')}`;
}
function refreshArena(t,id){const ar=$('#arena');if(!ar)return;const a=S.ans[id];ar.innerHTML=arenaHTML(t);
  if(a&&a.done&&a.pts>0){const e=$('#bossE');e&&e.classList.add('hitme')}
  const b=bossStats(t);if(b.defeated&&a&&a.done){for(let i=0;i<40;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#FFB627','#FF2D85','#00C2A8','#3A6BFF'][i%4];c.style.animationDelay=Math.random()*.5+'s';ar.appendChild(c)}}}

/* ---- summary ---- */
function pSummary(t){
  const s=topicStats(t),b=bossStats(t);
  if(t.id==='final'){
    return `<div class="arena"><div class="stars" style="font-size:40px">🏆</div><div class="bname">Boss rush report</div>
     <p>Total XP: <b>${totalXP()}</b></p></div>
     <div class="shot">📸 Screenshot this page!<small>It shows which levels to revisit before the exam.</small></div>
     <div class="sumsec"><h3>Your levels</h3>${TOPICS.filter(x=>x.id!=='final').map(x=>{const ss=topicStats(x),bb=bossStats(x);
       const tip=ss.done<ss.total?'Finish the remaining questions':bb.stars<3?'Redo the Summary page & boss':'Solid work!';
       return `<div class="fact"><div class="fq">Level ${x.n}: ${x.title} ${bb.finished?'⭐'.repeat(bb.stars):''}</div>${ss.done}/${ss.total} cleared, ${ss.first} first try · ${tip}</div>`}).join('')}</div>
     <div class="shot">📸 Screenshot before you leave!</div>`;
  }
  return `<div class="shot">📸 Screenshot this page!<small>Everything you need for Level ${t.n} is here. Scroll down and take a few screenshots.</small></div>
   <div class="card"><b>Your level stats:</b> ${s.done}/${s.total} cleared · ${s.first} on first try · Boss: ${b.finished?'⭐'.repeat(b.stars)+'☆'.repeat(3-b.stars):'not finished yet'}</div>
   ${t.subs.map((sb,i)=>`<div class="sumsec"><h3>${i+1}. ${sb.title}</h3>
     ${sb.cards.map(c=>`<div class="fact"><div class="fq">${c[0]}</div>${c[1]}</div>`).join('')}
     <div class="fact"><div class="fq">Method checklist (from the guided example)</div><ol>${sb.we.steps.map(x=>`<li>${x.t}</li>`).join('')}</ol></div>
     <div class="fact"><div class="fq">Watch out for</div>${sb.mistakes.map(m=>`<div class="smist">✗ <s>${m.w}</s><br>✓ ${m.r}<br><i>${m.y}</i></div>`).join('')}</div>
   </div>`).join('')}
   ${t.extraSummary?`<div class="sumsec"><h3>Extra key facts</h3>${t.extraSummary}</div>`:''}
   <div class="shot">📸 Screenshot this page before you leave!</div>`;
}

/* ================= TOOLBAR & LASER ================= */
const SYMS=['−','+','×','÷','=','(',')','/','.','²','³','√','∛','π','°','%','$','<','>','≤','≥','≠','±','x','y','n','θ','∠','△','∥','⊥','½'];
$('#toolbar').innerHTML='<span class="tlab">🧮 Maths</span>'+SYMS.map(s=>`<button data-sym="${s}">${s}</button>`).join('');
$('#toolbar').addEventListener('pointerdown',e=>{if(e.target.dataset.sym!==undefined)e.preventDefault()});
$('#toolbar').addEventListener('click',e=>{const s=e.target.dataset.sym;if(s===undefined)return;
  const inp=lastInput&&document.body.contains(lastInput)&&!lastInput.disabled?lastInput:null;
  if(!inp){toast('Tap an answer box first');return}
  const a=inp.selectionStart??inp.value.length,b=inp.selectionEnd??inp.value.length;
  inp.value=inp.value.slice(0,a)+s+inp.value.slice(b);inp.focus();inp.setSelectionRange(a+s.length,a+s.length)});
let laserOn=false;const lz=$('#laser');
$('#laserBtn').onclick=()=>{laserOn=!laserOn;$('#laserBtn').classList.toggle('on',laserOn);lz.style.display=laserOn?'block':'none';main.classList.toggle('laser-on',laserOn)};
window.addEventListener('pointermove',e=>{if(!laserOn)return;lz.style.transform=`translate(${e.clientX}px,${e.clientY}px)`},{passive:true});
window.addEventListener('pointerdown',e=>{if(!laserOn)return;lz.style.transform=`translate(${e.clientX}px,${e.clientY}px)`},{passive:true});
$('#mapBtn').onclick=()=>{S.view='menu';save();toTop();render()};
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
if(window.visualViewport){const vv=window.visualViewport;
  const fit=()=>{const kb=window.innerHeight-vv.height>120;
    document.body.style.height=kb?vv.height+'px':'';document.body.classList.toggle('kb',kb);
    if(kb){window.scrollTo(0,0);const a=document.activeElement;if(a&&a.tagName==='INPUT')setTimeout(()=>a.scrollIntoView({block:'center',behavior:'smooth'}),60)}};
  vv.addEventListener('resize',fit);vv.addEventListener('scroll',()=>{if(window.innerHeight-vv.height>120)window.scrollTo(0,0)});}
$('#toolbar').addEventListener('mousedown',e=>{if(e.target.dataset.sym!==undefined)e.preventDefault()});
if(!S.seenIntro)S.view='intro';
render();
</script>
</body>
</html>
